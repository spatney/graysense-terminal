[package]
name = "graysense"
version = "0.2.2"
edition = "2024"
description = "Graysense - a fast, modern terminal for GitHub Copilot agents, built on the Copilot SDK"
license = "MIT"
default-run = "graysense"

[features]
default = []
# Embed the Copilot CLI runtime in the binary (portable build, ~150 MB larger).
bundled = ["github-copilot-sdk/bundled-cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
github-copilot-sdk = { version = "=1.0.31", default-features = false, features = ["runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
anyhow = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Installs and updates (keep in step with the vpk version in scripts/release.ps1).
velopack = { version = "=1.2.161", features = ["public-utils"] }
# Terminal bays: ConPTY on Windows, a Unix PTY elsewhere (WezTerm's PTY layer).
portable-pty = "0.9"
which = "8"

[target.'cfg(windows)'.dependencies]
# A second launch hands over to the running window instead of starting another Copilot runtime.
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
